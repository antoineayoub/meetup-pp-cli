# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "meetup-pp-cli"
display_name = "Meetup"
description = "Query, diff, and script Meetup groups and events from the terminal — with local sync, cross-group digests, and conflict detection no web UI offers."
project_kind = "cli"

[secrets.file]
path = "~/.config/meetup-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
MEETUP_ACCESS_TOKEN = true
MEETUP_BEARER_AUTH = true
